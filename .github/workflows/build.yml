name: Build Signed APK from Zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find and unzip source
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found in root!"
            exit 1
          fi
          mkdir -p source
          unzip -o "$ZIP_FILE" -d source
          INNER=$(find source -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$INNER" ]; then
            mv "$INNER"/* source/ 2>/dev/null || true
            mv "$INNER"/.[!.]* source/ 2>/dev/null || true
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: source

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.keystore

      - name: Build signed release APK (32-bit / armeabi-v7a)
        working-directory: source
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleGmsMobileArmeabiRelease --stacktrace

      - name: Clean up keystore
        if: always()
        run: rm -f ${{ github.workspace }}/release.keystore

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NomaTune-armeabi-signed
          path: source/app/build/outputs/apk/**/*.apk
